<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="AI Healthcare Assistant — Describe your symptoms and get instant, intelligent health guidance powered by NLP and neural networks.">
    <title>AI Healthcare Assistant 🩺</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body>
    <div class="chat-wrapper">
        <div class="chat-container">
            <header class="chat-header">
                <div class="header-info">
                    <i class="fa-solid fa-stethoscope header-icon"></i>
                    <div class="header-text">
                        <h1>AI Healthcare Assistant</h1>
                        <div class="session-status" id="session-status">
                            <span class="status-dot"></span>
                            <span class="status-label">Session Active</span>
                        </div>
                    </div>
                </div>
                <div class="header-actions">
                    <button id="new-session-btn" class="icon-btn" title="Start New Session">
                        <i class="fa-solid fa-rotate"></i>
                    </button>
                    <button id="theme-toggle" class="icon-btn" title="Toggle Dark Mode">
                        <i class="fa-solid fa-moon"></i>
                    </button>
                    <button id="clear-chat" class="icon-btn" title="Clear Chat">
                        <i class="fa-solid fa-trash"></i>
                    </button>
                </div>
            </header>

            <div class="symptom-tracker" id="symptom-tracker" style="display:none;">
                <span class="tracker-label"><i class="fa-solid fa-list-check"></i> Session Symptoms:</span>
                <div class="tracker-tags" id="tracker-tags"></div>
            </div>

            <div class="chat-history" id="chat-history"></div>

            <!-- Typing indicator -->
            <div class="typing-indicator" id="typing-indicator" style="display: none;">
                <div class="dot"></div>
                <div class="dot"></div>
                <div class="dot"></div>
            </div>

            <div class="quick-suggestions">
                <button class="suggestion-btn" title="Click to fill">I have fever</button>
                <button class="suggestion-btn" title="Click to fill">Severe headache</button>
                <button class="suggestion-btn" title="Click to fill">Chest pain and breathless</button>
                <button class="suggestion-btn" title="Click to fill">Stomach ache and vomiting</button>
                <button class="suggestion-btn" title="Click to fill">Snake bite</button>
                <button class="suggestion-btn" title="Click to fill">Rash and itching</button>
                <button class="suggestion-btn" title="Click to fill">Feeling very weak</button>
                <button class="suggestion-btn" title="Click to fill">Also have cough</button>
            </div>

            <div class="input-area">
                <button id="emoji-btn" class="icon-btn"><i class="fa-regular fa-face-smile"></i></button>
                <input type="text" id="user-input" placeholder="Describe your symptoms..." autocomplete="off">
                <button id="send-btn" class="send-btn"><i class="fa-solid fa-paper-plane"></i></button>
            </div>

            <div class="footer-disclaimer">
                <i class="fa-solid fa-shield-heart"></i>
                This assistant provides general information and is <strong>not</strong> a substitute for professional medical advice.
            </div>
        </div>
    </div>

    <script src="{{ url_for('static', filename='script.js') }}"></script>
</body>
</html>
